<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a73e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#63a0ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8f1ff;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Main background -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGrad)" filter="url(#shadow)"/>
  
  <!-- Chat bubble shape -->
  <path d="M60 55 
           H140 
           A15 15 0 0 1 155 70 
           V120 
           A15 15 0 0 1 140 135 
           H90 
           L65 155 
           V135 
           H60 
           A15 15 0 0 1 45 120 
           V70 
           A15 15 0 0 1 60 55 Z" 
        fill="url(#bubbleGrad)" 
        opacity="0.95"/>
  
  <!-- Lightning bolt / quill pen symbol inside bubble -->
  <path d="M105 65 
           L85 100 
           H100 
           L95 130 
           L120 90 
           H105 
           L115 65 Z" 
        fill="#1a73e8"/>
  
  <!-- Small accent dots -->
  <circle cx="75" cy="85" r="3" fill="#63a0ff" opacity="0.6"/>
  <circle cx="125" cy="115" r="2.5" fill="#63a0ff" opacity="0.5"/>
</svg>
